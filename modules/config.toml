theme = "adwaita-dark"

[editor]
scrolloff = 999
line-number = "relative"
end-of-line-diagnostics = "hint"
bufferline = "multiple"
mouse = true

[editor.soft-wrap]
enable = true

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.indent-guides]
render = true
character = "|"
skip-levels = 1

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
C-p = ["move_line_up",   "scroll_up"]
C-n = ["move_line_down", "scroll_down"]

[keys.insert]
"C-[" = "normal_mode"

[keys.select]
"C-[" = "normal_mode"

