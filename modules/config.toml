theme = "defaultplus"

[editor]
line-number = "relative"
mouse = true
end-of-line-diagnostics = "hint"

[editor.inline-diagnostics]
cursor-line = "warning"

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[keys.normal]
C-p = ["move_line_up",   "scroll_up"]
C-n = ["move_line_down", "scroll_down"]
F1 = ":toggle whitespace.render all none"
F2 = ":toggle end-of-line-diagnostics hint disable"
F3 = ":toggle inline-diagnostics.cursor-line warning disable"

[keys.insert]
"C-[" = "normal_mode"

[keys.select]
"C-[" = "normal_mode"

